<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namen-Overlay</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#f8fafc;--muted:#94a3b8;--gold:#fbbf24;--red:#be123c;--green:#16a34a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif;user-select:none}
  [hidden]{display:none!important}
  button{border:0;border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font-size:16px}
  button:active{transform:scale(.96)}
  #app{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
  #app.flash{animation:flash .5s}

  #v1{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:10px;justify-content:center;align-content:center}
  #v1 button{padding:10px 14px;font-size:clamp(14px,3vw,22px)}
  #v2{flex:1;min-height:0;display:flex;flex-direction:column}

  .top{display:flex;flex-wrap:wrap;gap:4px;padding:6px 6px 0;align-items:center}
  .top .sp{flex:1}
  .top button{padding:4px 9px;font-size:14px;color:var(--muted)}
  .top button.on{background:var(--gold);color:#111}
  #gm.on{background:var(--red);color:#fff}
  .modes{display:flex;gap:2px;background:var(--card);border-radius:10px;padding:2px}
  .modes button{background:transparent;padding:3px 8px}
  .top2 .lab{color:var(--muted);font-size:13px;padding:0 2px}

  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;min-height:0}
  #nm{text-align:center;font-weight:700;color:var(--gold);font-size:clamp(22px,min(15vw,24vh),90px);line-height:1.05}
  #app.lives #stage{flex:0 0 auto;padding:4px 8px 2px}
  #app.lives #nm{font-size:clamp(22px,min(8vw,6vh),40px)}
  #nm.out{color:#64748b;text-decoration:line-through}
  #nm.win{color:#4ade80;animation:pulse .8s ease-in-out infinite alternate}
  #nm.over{color:#f87171}
  #nm.shake{animation:shake .4s}
  #hs{font-size:26px;letter-spacing:3px;line-height:1.1}

  .ht{font-style:normal;display:inline-block}
  .ht.f{color:#ef4444}
  .ht.e{color:#475569}
  .ht.h{background:linear-gradient(90deg,#ef4444 50%,#475569 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ht.crack{animation:crack .6s ease-out}

  #board{flex:1;min-height:0;overflow:auto;display:grid;gap:5px;padding:4px 8px;align-content:start}
  .v #board{grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))}
  .h #board{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
  .chip{background:var(--card);border:2px solid transparent;border-radius:10px;cursor:pointer;min-width:0;display:flex}
  .chip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .chip .hh{white-space:nowrap}
  .v .chip{flex-direction:row;align-items:center;justify-content:space-between;gap:6px;padding:3px 8px}
  .v .chip b{font-size:15px}
  .v .chip .hh{font-size:15px;letter-spacing:1px}
  .h .chip{flex-direction:column;align-items:center;padding:4px 6px}
  .h .chip b{font-size:14px;max-width:100%}
  .h .chip .hh{font-size:14px;letter-spacing:1px}
  .chip.cur{border-color:var(--gold);box-shadow:0 0 10px #fbbf2466;background:#2b3a52}
  .chip.out{opacity:.45}
  .chip.out b{text-decoration:line-through}
  .chip.lead{border-color:#4ade80}

  .bot{display:flex;gap:5px;padding:6px}
  .bot button{flex:1;font-size:20px;padding:8px 4px;background:var(--ink);color:#111;font-weight:700}
  .bot .m{background:var(--red);color:#fff;font-size:16px}
  .bot .p{background:var(--green);color:#fff;font-size:16px}

  @keyframes flash{0%{background:#991b1b}100%{background:var(--bg)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes crack{0%{transform:scale(1.9) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
</style>
</head>
<body>
<div id="app">
  <div id="v1"></div>
  <div id="v2" hidden>
    <div class="top">
      <button id="chg" title="Klasse wechseln"></button>
      <span class="sp"></span>
      <div class="modes">
        <button data-m="order"  title="Der Reihe nach">➡️</button>
        <button data-m="random" title="Völlig zufällig">🎲</button>
        <button data-m="round"  title="Zufällig – jeder einmal, dann neu mischen">🔁</button>
      </div>
      <button id="gm" title="Spielmodus mit Leben">♥</button>
      <button id="pip" title="Als schwebendes Fenster über allem anzeigen">⧉</button>
    </div>
    <div class="top top2" id="top2" hidden>
      <span class="lab">Leben:</span>
      <div class="modes" id="sl">
        <button data-n="1">1♥</button><button data-n="2">2♥</button><button data-n="3">3♥</button>
      </div>
      <span class="sp"></span>
      <button id="or" title="Hochkant ⬍ / Breit ⬌"></button>
      <button id="rs" title="Neues Spiel (alle wieder volle Leben)">↺</button>
    </div>
    <div id="stage"><div id="nm">?</div><div id="hs" hidden></div></div>
    <div id="board" hidden></div>
    <div class="bot">
      <button id="up" title="zurück">▲</button>
      <button id="m1" class="m" title="Ein Leben weniger" hidden>−1</button>
      <button id="m2" class="m" title="Ein halbes Leben weniger" hidden>−½</button>
      <button id="p2" class="p" title="Ein halbes Leben dazu" hidden>+½</button>
      <button id="p1" class="p" title="Ein Leben dazu" hidden>+1</button>
      <button id="dn" title="weiter">▼</button>
    </div>
  </div>
</div>

<script>
const CLASSES = {
  "S-De-x1a": ["Alice", "Feodor", "Freddie", "Archi", "Zara F.", "Oscar", "Zara M.", "Nicholas", "Barron", "Edward", "Conor", "Isabel", "Fred", "Tom"],
  "S-De-x2a": ["Roscoe", "Arabella D.", "Bay", "Felix", "Arabella H.", "Mason", "Ali", "Ruben", "Charles", "Louis", "Toby", "Jack"],
  "S-De-y1a": ["Jack", "Oscar", "Rafe", "Freddie", "Willoughby", "Algy", "Oliver D.", "Monty", "Zoe", "Annabel", "Ava", "Stefan", "Tom", "Tal", "Ivo", "Eloise", "Oliver U.", "Alfie", "Stella", "Archie", "Luca"],
  "R-De-1": ["Viva", "Arabella", "Willa", "Nessie", "Lucy", "Jasper", "Rex", "Louisa", "Iona", "Paulo", "Ndishu", "Jessy", "Scarlett", "Facundo", "Olivia", "Benji"],
  "H-De-1": ["Atty", "Max", "Edward", "Aubrey", "Freddy"],
  "H-De-3": ["Eddie", "Reuben", "Sofia", "Katrina", "Spencer", "Matilda", "Caitlin"],
  "L6-De-4": ["Michael", "Ina", "Oscar", "Cecilia", "Peter", "Charles", "Charlie"],
  "L6-De-5dez": ["Patrick"],
  "U6-De-4": ["Rafe", "Carys"]
};

const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
const APP = document.getElementById("app");
const $ = id => id === "app" ? APP : APP.querySelector("#" + id);   // works in the page and in the floating window
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

const MAXL = 5;                                  // bonus lives allowed up to 5
let cls = null;
let mode   = lsGet("omode") || "random";         // order | random | round
let start  = +lsGet("start") || 3;               // starting lives 1 | 2 | 3
let orient = lsGet("orient") || "v";             // v = hochkant, h = breit
let gameOn = false, hist = [], idx = -1, pool = [], recent = [], ordIdx = -1, pipWin = null;
const LIVES = {};                                // LIVES[class][name] = lives (steps of 0.5)
const getL = (c,n) => (LIVES[c] && LIVES[c][n] !== undefined) ? LIVES[c][n] : start;
const setL = (c,n,v) => { (LIVES[c] = LIVES[c] || {})[n] = v; };
const alive = c => CLASSES[c].filter(n => getL(c,n) > 0);
const total = () => CLASSES[cls].length;
const over = () => { if (!gameOn) return false; const a = alive(cls).length; return a === 0 || (a === 1 && total() > 1); };
const pulse = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
const hearts = (l, crackAt = -1) => {
  let h = ""; const slots = Math.max(start, Math.ceil(l));
  for (let i = 0; i < slots; i++) h += `<i class="ht ${l >= i+1 ? "f" : l >= i+.5 ? "h" : "e"}${i === crackAt ? " crack" : ""}">♥</i>`;
  return h;
};

// ---- choosing the next name ----
function pickName(){
  const base = gameOn ? alive(cls) : CLASSES[cls];
  if (!base.length) return null;
  if (mode === "order") {
    const list = CLASSES[cls];
    for (let k = 1; k <= list.length; k++) {
      const j = (ordIdx + k) % list.length;
      if (base.includes(list[j])) { ordIdx = j; return list[j]; }
    }
    return null;
  }
  if (mode === "random") {
    const gap = Math.min(3, base.length - 1);
    const ok = base.filter(n => !recent.includes(n));
    const arr = ok.length ? ok : base;
    const name = arr[Math.random()*arr.length|0];
    recent.push(name); if (recent.length > gap) recent.shift();
    return name;
  }
  pool = pool.filter(n => base.includes(n));
  if (!pool.length) pool = shuffle([...base]);
  return pool.pop();
}

// ---- drawing ----
function renderBoard(){
  const cur = hist[idx], al = alive(cls);
  const lead = (al.length === 1 && total() > 1) ? al[0] : null;
  $("board").style.setProperty("--cols", total() > 14 ? 2 : 1);
  $("board").innerHTML = CLASSES[cls].map((n,i) => {
    const l = getL(cls,n);
    return `<div class="chip${l<=0?" out":""}${n===cur?" cur":""}${n===lead?" lead":""}" data-i="${i}"><b>${l<=0?"💀 ":""}${n}</b><span class="hh">${hearts(l)}</span></div>`;
  }).join("");
  const c = $("board").querySelector(".cur"); if (c && c.scrollIntoView) c.scrollIntoView({block:"nearest"});
}

function show(anim){
  const nm = $("nm"); nm.className = "";
  const n = hist[idx];
  if (gameOn) {
    renderBoard();
    const al = alive(cls);
    if (al.length === 0) { nm.textContent = "💀 Game over"; nm.className = "over"; $("hs").innerHTML = ""; return; }
    if (al.length === 1 && total() > 1) { nm.textContent = "🏆 " + al[0]; nm.className = "win"; $("hs").innerHTML = hearts(getL(cls, al[0])); return; }
  }
  if (n === undefined) { nm.textContent = "?"; return; }
  ordIdx = CLASSES[cls].indexOf(n);            // "der Reihe nach" continues from whoever is shown
  const l = getL(cls, n), out = gameOn && l <= 0;
  nm.textContent = (out ? "💀 " : "") + n;
  if (out) nm.classList.add("out");
  if (gameOn) $("hs").innerHTML = hearts(l, anim === "loss" ? Math.floor(l) : -1);
  if (anim === "loss") { pulse(nm, "shake"); pulse($("app"), "flash"); }
}

// ---- actions ----
const down = () => {
  if (idx < hist.length - 1) idx++;
  else { const n = pickName(); if (n === null) { show(); return; } hist.push(n); idx = hist.length - 1; }
  show();
};
const up = () => { if (idx > 0) { idx--; show(); } };
const adjust = d => {
  if (!gameOn || idx < 0) return;
  const n = hist[idx], l = getL(cls, n);
  if (d < 0 && (over() || l <= 0)) return;
  const v = Math.max(0, Math.min(MAXL, l + d)); if (v === l) return;
  setL(cls, n, v); if (d > 0) pool = [];
  show(d < 0 ? "loss" : "");
};

const sizeFor = () => {
  if (!cls) return [360, 210];
  if (!gameOn) return [320, 170];
  const n = total(), maxW = (screen.availWidth || 1300) - 40, maxH = (screen.availHeight || 900) - 60;
  if (orient === "v") { const cols = n > 14 ? 2 : 1, rows = Math.ceil(n / cols); return [Math.min(maxW, cols*250 + 40), Math.min(maxH, 290 + rows*32)]; }
  const w = Math.min(maxW, 1000), per = Math.max(1, Math.floor((w - 16) / 128)), rows = Math.ceil(n / per);
  return [w, Math.min(maxH, 270 + rows*50)];
};
const resizePip = () => { if (!pipWin) return; const [w,h] = sizeFor(); try { pipWin.resizeTo(w,h); } catch(e) {} };

const paintMode = () => APP.querySelectorAll(".modes [data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
const paintStart = () => APP.querySelectorAll("#sl button").forEach(b => b.classList.toggle("on", +b.dataset.n === start));
const paintGame = () => {
  $("gm").classList.toggle("on", gameOn);
  $("gm").textContent = gameOn ? "♥ " + start : "♥";
  ["top2","hs","board","m1","m2","p2","p1"].forEach(id => $(id).hidden = !gameOn);
  $("app").classList.toggle("lives", gameOn);
  $("app").classList.toggle("v", orient === "v"); $("app").classList.toggle("h", orient === "h");
  $("or").textContent = orient === "v" ? "⬍ hochkant" : "⬌ breit";
  paintStart(); resizePip();
};

$("v1").innerHTML = Object.keys(CLASSES).map(c => `<button data-c="${c}">${c}</button>`).join("");
$("v1").querySelectorAll("button").forEach(b => b.onclick = () => {
  cls = b.dataset.c;
  pool = []; recent = []; hist = []; idx = -1; ordIdx = -1;
  $("v1").hidden = true; $("v2").hidden = false;
  $("chg").textContent = "◂ " + cls;
  paintMode(); paintGame(); down();
});
$("chg").onclick = () => { cls = null; $("v2").hidden = true; $("v1").hidden = false; resizePip(); };
APP.querySelectorAll(".modes [data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; lsSet("omode", mode); pool = []; recent = []; paintMode(); });
$("gm").onclick = () => { gameOn = !gameOn; pool = []; recent = []; paintGame(); show(); };
APP.querySelectorAll("#sl button").forEach(b => b.onclick = () => {
  start = +b.dataset.n; lsSet("start", start);
  for (const k in LIVES) delete LIVES[k];                    // new game with the new number of lives
  pool = []; recent = []; paintGame(); show();
});
$("or").onclick = () => { orient = orient === "v" ? "h" : "v"; lsSet("orient", orient); paintGame(); show(); };
$("rs").onclick = () => { LIVES[cls] = {}; pool = []; recent = []; show(); };
$("dn").onclick = down; $("up").onclick = up;
$("m1").onclick = () => adjust(-1); $("m2").onclick = () => adjust(-.5);
$("p2").onclick = () => adjust(.5); $("p1").onclick = () => adjust(1);
$("board").onclick = e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const i = +c.dataset.i, n = CLASSES[cls][i];
  if (hist[idx] !== n) { hist.length = idx + 1; hist.push(n); idx = hist.length - 1; }
  ordIdx = i; pool = pool.filter(x => x !== n); show();
};

const onKey = e => {
  if (!cls) return;
  if (["Space","Enter","ArrowDown","ArrowRight"].includes(e.code)) { e.preventDefault(); down(); }
  if (["ArrowUp","ArrowLeft"].includes(e.code)) { e.preventDefault(); up(); }
  if (["Minus","NumpadSubtract"].includes(e.code)) { e.preventDefault(); adjust(-1); }
  if (["Equal","NumpadAdd"].includes(e.code)) { e.preventDefault(); adjust(1); }
  if (e.code === "BracketLeft")  { e.preventDefault(); adjust(-.5); }
  if (e.code === "BracketRight") { e.preventDefault(); adjust(.5); }
};
document.addEventListener("keydown", onKey);

// ---- floating always-on-top window (Edge/Chrome on Windows) ----
$("pip").onclick = async () => {
  if (pipWin) { pipWin.close(); return; }
  if (!("documentPictureInPicture" in window)) { alert("Schwebendes Fenster braucht Edge oder Chrome auf Windows."); return; }
  const [w,h] = sizeFor();
  const pw = await documentPictureInPicture.requestWindow({ width: w, height: h });
  pipWin = pw;
  const st = pw.document.createElement("style");
  st.textContent = [...document.styleSheets].map(ss => [...ss.cssRules].map(r => r.cssText).join("\n")).join("\n");
  pw.document.head.append(st);
  pw.document.body.append(APP);
  pw.document.addEventListener("keydown", onKey);
  pw.addEventListener("pagehide", () => { document.body.append(APP); pipWin = null; });
};

paintMode(); paintGame();
</script>
</body>
</html>
